[project]
name = "mcp-read-only-grafana"
version = "0.4.0"
description = "MCP server for Grafana with a read-only default and a separate write-capable command"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["grafana", "mcp", "mcp-server", "read-only", "observability"]
authors = [
    {name = "Lukas Lehner", email = "lehner.lukas@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # The server builds on mcp.server.mcpserver (the 2.x successor to FastMCP).
    # Capped below 3 so the next major SDK rewrite cannot silently break installs
    # the way 2.0.0 did when it removed mcp.server.fastmcp.
    "mcp>=2.0.0,<3",
    "pyyaml>=6.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/lukleh/mcp-read-only-grafana"
Repository = "https://github.com/lukleh/mcp-read-only-grafana"
Issues = "https://github.com/lukleh/mcp-read-only-grafana/issues"
Changelog = "https://github.com/lukleh/mcp-read-only-grafana/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-timeout>=2.2.0",
    "pytest-asyncio>=0.21.0",
    # Capped to one minor so a routine relock cannot change ruff's implicit
    # default rule set; bumping the cap is a deliberate change.
    "ruff>=0.16,<0.17",
    "ty>=0.0.28",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
mcp-read-only-grafana = "mcp_read_only_grafana.server:main_read_only"
mcp-grafana-write = "mcp_read_only_grafana.server:main_write"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_read_only_grafana"]

[tool.ruff.lint]
# The rule set is ruff 0.16's implicit defaults (UP, I, BLE, SIM, DTZ, ...
# on top of the old E4/E7/E9/F). The dev-extra pin `ruff>=0.16,<0.17` keeps
# those defaults deterministic across relocks; the opt-outs below are
# deliberate, documented exceptions.
ignore = [
    # Broad `except Exception` at MCP tool boundaries is the documented
    # design: exceptions propagate to the framework, which converts them to
    # proper error responses (see CLAUDE.md "Error Handling Pattern").
    "BLE001",
    # The exception types raised (and their messages) are observable API
    # behavior for MCP clients; changing them is out of scope for linting.
    "TRY004",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (require live Grafana instance)",
    "unit: marks tests as unit tests (no external dependencies)",
]

[tool.vulture]
paths = ["src", "tests"]
exclude = [".venv", "venv", "build", "dist", "node_modules", "__pycache__", "site-packages"]
ignore_decorators = ["@*.tool*", "@pytest.fixture", "@field_validator", "@model_validator", "@validator"]
ignore_names = ["model_config", "pytest_*"]
min_confidence = 80

[tool.ty.src]
include = ["src"]
